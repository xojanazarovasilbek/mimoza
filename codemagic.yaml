workflows:
  ios-unsigned:
    name: Mimoza iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile_app
          flutter pub get
      - name: Analyze and test Flutter app
        script: |
          cd mobile_app
          flutter analyze
          flutter test
      - name: Build iOS without code signing
        script: |
          cd mobile_app
          flutter build ios --debug --no-codesign
    artifacts:
      - mobile_app/build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-sideload-release:
    name: Mimoza iOS release for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: https://mimozafloral.uz
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile_app
          flutter pub get
      - name: Analyze and test Flutter app
        script: |
          cd mobile_app
          flutter analyze
          flutter test
      - name: Build unsigned iOS release
        script: |
          cd mobile_app
          if [ -n "${API_BASE_URL:-}" ]; then
            case "$API_BASE_URL" in
              https://*) ;;
              *) echo "API_BASE_URL must use HTTPS on iOS." >&2; exit 1 ;;
            esac
          fi
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="${API_BASE_URL:-}"
      - name: Package unsigned IPA
        script: |
          cd mobile_app
          mkdir -p build/ios/sideload/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/sideload/Payload/Runner.app
          cd build/ios/sideload
          zip -qry Mimoza-unsigned.ipa Payload
    artifacts:
      - mobile_app/build/ios/sideload/Mimoza-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log